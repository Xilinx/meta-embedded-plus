args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0110_1_01110000/external/emb-plus-ve2302-xrt/emb-plus-ve2302-xrt_2025.2_1115_1_01110000.tar.gz
    - --machine-name emb-plus-ve2302-xrt

kconfig:
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    post:
        UBOOT_BOOT_SCRIPT:emb-plus-ve2302-xrt:${DISTRO}:
            comment: 'Use the specific boot script'
            op: '='
            val: 'u-boot-xlnx-scr'

