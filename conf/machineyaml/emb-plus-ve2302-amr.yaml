args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0306_1_03070000/external/emb-plus-ve2302-amr/emb-plus-ve2302-amr_2026.1_0306_1_03070000.tar.gz
    - --machine-name emb-plus-ve2302-amr
    - -g full
    - -O emb-plus-amr
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
    CONFIG_YOCTO_BBMC_CORTEXR5_1_BAREMETAL: y
    CONFIG_SUBSYSTEM_SERIAL_SERIAL1_SELECT: y
    CONFIG_SUBSYSTEM_BOOTMODE_5: y

machine:
    pre:
        TFA_CONSOLE:
            op: '?='
            val: 'pl011_1'
        UBOOT_ENTRYPOINT:
            op: '?='
            val: '0x8200000'
        UBOOT_LOADADDRESS:
            op: '?='
            val: '0x8200000'
    post:
        BOOTBIN_INC:
            comment: 'Enable hello-world application'
            op: '='
            val: 'versal-hello-world.inc'
